name: Daily AI Law Sentiment Pipeline

on:
  schedule:
    # Runs every day at 11:00 UTC
    - cron: "0 11 * * *"
  workflow_dispatch:        # allows manual runs from the Actions tab
  push:
    branches: [ main ]      # also runs on pushes to main (useful for testing)

# Force Node 24 ahead of the June 2, 2026 default switch.
# Remove this env block after June 2, 2026 once Node 24 is the default.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write           # required so the workflow can commit data/reports back

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5     # v5 runs on Node 24 (was v4 on Node 20)

      - name: Set up Python
        uses: actions/setup-python@v6 # v6 runs on Node 24 (was v4/v5 on Node 20)
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        env:
          REDDIT_CLIENT_ID:       ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET:   ${{ secrets.REDDIT_CLIENT_SECRET }}
          REGULATIONS_API_KEY:    ${{ secrets.REGULATIONS_API_KEY }}
        run: |
          python main.py

      - name: Commit and push updated data + report
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ reports/ pipeline.log README.md
          git diff --quiet --cached || git commit -m "Daily update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
